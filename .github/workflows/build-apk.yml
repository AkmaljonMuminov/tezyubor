name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Android papkalarini yaratish
        run: |
          flutter create --org uz.tezyubor --project-name tezyubor_mobile .
          rm -f test/widget_test.dart
          sed -i 's/applicationId = ".*"/applicationId = "uz.tezyubor.app"/' android/app/build.gradle.kts || true
          sed -i 's/applicationId ".*"/applicationId "uz.tezyubor.app"/' android/app/build.gradle || true

      - run: flutter pub get

      - name: Testlar
        run: flutter test
        continue-on-error: true

      - name: APK yig'ish
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: tezyubor-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
