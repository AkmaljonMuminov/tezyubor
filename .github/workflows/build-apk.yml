name: Build APK

on:
  push:
    branches: [main, "feature/**"]
  workflow_dispatch:
    inputs:
      api_mode:
        description: "mock (test, backendsiz) yoki real (backend bilan)"
        default: mock
        type: choice
        options: [mock, real]
      api_base_url:
        description: "Faqat real rejim uchun: backend manzili (https://...)"
        default: ""
        type: string

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Android papkalarini yaratish
        run: |
          flutter create --org uz.tezyubor --project-name tezyubor_mobile .
          rm -f test/widget_test.dart
          sed -i 's/applicationId = ".*"/applicationId = "uz.tezyubor.app"/' android/app/build.gradle.kts || true
          sed -i 's/applicationId ".*"/applicationId "uz.tezyubor.app"/' android/app/build.gradle || true
          # Release APK'da internet ruxsati standart holda yo'q (faqat debug'da bor) — real rejim uchun kerak
          grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml || \
            sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' android/app/src/main/AndroidManifest.xml

      - name: Android — barmoq izi (local_auth) va xavfsizlik sozlamalari
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          # 1) Barmoq izi ruxsati
          grep -q 'android.permission.USE_BIOMETRIC' "$MANIFEST" || \
            sed -i 's|<application|<uses-permission android:name="android.permission.USE_BIOMETRIC"/>\n    <application|' "$MANIFEST"
          # 2) Zaxira nusxaga (cloud backup) tushmasin: secure storage kalitlari boshqa qurilmada baribir ochilmaydi
          grep -q 'android:allowBackup' "$MANIFEST" || \
            sed -i 's|<application|<application android:allowBackup="false"|' "$MANIFEST"
          # 3) local_auth FragmentActivity talab qiladi
          ACT=$(find android/app/src/main -name 'MainActivity.*' | head -n1)
          sed -i 's/FlutterActivity/FlutterFragmentActivity/g' "$ACT"
          # 4) BiometricPrompt AppCompat mavzusini talab qiladi
          for f in android/app/src/main/res/values/styles.xml android/app/src/main/res/values-night/styles.xml; do
            [ -f "$f" ] && sed -i -E 's#@android:style/Theme\.(Light|Black)(\.NoTitleBar)?#Theme.AppCompat.DayNight.NoActionBar#g' "$f"
          done
          # Tekshiruv: shablon o'zgargan bo'lsa ogohlantiramiz (barmoq izi PIN'ga qaytadi, ilova yiqilmaydi)
          grep -q 'USE_BIOMETRIC' "$MANIFEST" || echo "::warning::USE_BIOMETRIC manifestga qo'shilmadi"
          grep -q 'allowBackup="false"' "$MANIFEST" || echo "::warning::allowBackup o'chirilmadi"
          grep -q 'FlutterFragmentActivity' "$ACT" || echo "::warning::MainActivity FlutterFragmentActivity emas — barmoq izi ishlamaydi"
          grep -rq 'Theme.AppCompat' android/app/src/main/res/values/styles.xml || echo "::warning::styles.xml AppCompat'ga o'tmadi — barmoq izi ishlamaydi"
          echo "--- AndroidManifest.xml ---"; cat "$MANIFEST"
          echo "--- $ACT ---"; cat "$ACT"
          echo "--- styles.xml ---"; cat android/app/src/main/res/values/styles.xml

      - name: Launcher ikonkalarini joylash
        run: cp -r launcher_res/. android/app/src/main/res/

      - run: flutter pub get

      - name: Statik tahlil (natijasi build'ni to'xtatmaydi)
        run: flutter analyze --no-fatal-infos
        continue-on-error: true

      - name: Testlar
        run: flutter test
        continue-on-error: true

      - name: APK yig'ish
        env:
          API_MODE: ${{ github.event.inputs.api_mode || 'mock' }}
          API_BASE_URL: ${{ github.event.inputs.api_base_url }}
        run: |
          DEFINES="--dart-define=API_MODE=$API_MODE"
          if [ -n "$API_BASE_URL" ]; then DEFINES="$DEFINES --dart-define=API_BASE_URL=$API_BASE_URL"; fi
          flutter build apk --release $DEFINES

      - uses: actions/upload-artifact@v4
        with:
          name: tezyubor-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
